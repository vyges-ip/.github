name: Upstream Sync (Reusable)

# AI metadata generation was removed 2026-04-24 after the stripped-metadata
# path caused a silent-boot FPGA bitstream in the edge_sensor demo (u_uart
# port map was emitted with only .tl_i/.tl_o because the AI-regenerated
# metadata dropped cio_* and intr_* interfaces). Silent silicon bugs are
# worse than caught sync failures — this workflow now only syncs files
# declared in upstream.yaml's import[] and never invents metadata.
#
# For IPs whose canonical metadata lives upstream (OpenTitan, etc.), have
# upstream.yaml import it via:
#   import:
#     metadata:
#       - path: "vyges-metadata.json"
# For Vyges-authored IPs, commit metadata to the canonical vyges/<repo>
# and let this sync mirror it to vyges-ip/<repo>.

on:
  workflow_call:
    inputs:
      force_metadata:
        description: 'DEPRECATED — AI metadata generation has been removed. This input is accepted for backward compatibility with existing per-IP caller workflows but has no effect.'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read upstream.yaml
        id: upstream
        run: |
          if [[ ! -f upstream.yaml ]]; then
            echo "Error: upstream.yaml not found"
            exit 1
          fi
          TYPE=$(yq eval '.upstream.type' upstream.yaml)
          if [[ "$TYPE" == "standalone" ]]; then
            echo "repo=$(yq eval '.upstream.repo // .upstream.source' upstream.yaml)" >> $GITHUB_OUTPUT
          else
            echo "repo=$(yq eval '.upstream.repo // .upstream.source' upstream.yaml)" >> $GITHUB_OUTPUT
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "branch=$(yq eval '.upstream.branch // "main"' upstream.yaml)" >> $GITHUB_OUTPUT
          echo "commit=$(yq eval '.upstream.commit' upstream.yaml)" >> $GITHUB_OUTPUT
          echo "path=$(yq eval '.upstream.path // ""' upstream.yaml)" >> $GITHUB_OUTPUT

      - name: Check if sync needed
        id: check
        run: |
          # Check if repo has synced content
          if [[ ! -d rtl ]] && [[ ! -f LICENSE ]]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
            echo "sync_type=initial" >> $GITHUB_OUTPUT
          else
            # Clone and check for updates
            rm -rf /tmp/upstream
            git clone --quiet "${{ steps.upstream.outputs.repo }}" /tmp/upstream
            cd /tmp/upstream
            git checkout "${{ steps.upstream.outputs.branch }}" --quiet 2>/dev/null || true
            LATEST=$(git rev-parse HEAD)
            CURRENT="${{ steps.upstream.outputs.commit }}"
            echo "latest=$LATEST" >> $GITHUB_OUTPUT
            if [[ "$CURRENT" == "$LATEST" ]]; then
              echo "needs_sync=false" >> $GITHUB_OUTPUT
              echo "sync_type=none" >> $GITHUB_OUTPUT
            else
              echo "needs_sync=true" >> $GITHUB_OUTPUT
              echo "sync_type=update" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Clone upstream
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          if [[ ! -d /tmp/upstream ]]; then
            rm -rf /tmp/upstream
            git clone --quiet "${{ steps.upstream.outputs.repo }}" /tmp/upstream
          fi
          cd /tmp/upstream
          if [[ "${{ steps.check.outputs.sync_type }}" == "initial" ]]; then
            COMMIT="${{ steps.upstream.outputs.commit }}"; if [[ "$COMMIT" != "null" && -n "$COMMIT" ]]; then git checkout "$COMMIT" --quiet; else echo "No pinned commit — using HEAD of branch"; fi
          else
            git checkout "${{ steps.check.outputs.latest }}" --quiet
          fi

      - name: Sync upstream files
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          UPSTREAM_TYPE="${{ steps.upstream.outputs.type }}"
          UPSTREAM_PATH="${{ steps.upstream.outputs.path }}"

          # Determine source directory
          if [[ "$UPSTREAM_TYPE" == "monorepo" ]] && [[ -n "$UPSTREAM_PATH" ]]; then
            SRC_BASE="/tmp/upstream/$UPSTREAM_PATH"
          else
            SRC_BASE="/tmp/upstream"
          fi

          # Process RTL imports
          RTL_COUNT=$(yq eval '.import.rtl | length' upstream.yaml)
          for ((i=0; i<$RTL_COUNT; i++)); do
            UP_PATH=$(yq eval ".import.rtl[$i].path" upstream.yaml)
            LOCAL_PATH=$(yq eval ".import.rtl[$i].map_to" upstream.yaml)
            echo "Syncing RTL: $UP_PATH -> $LOCAL_PATH"
            mkdir -p "$LOCAL_PATH"
            if [[ "$UPSTREAM_TYPE" == "monorepo" ]]; then
              cp -r "$SRC_BASE/$UP_PATH"/* "$LOCAL_PATH/" 2>/dev/null || \
              cp -r "/tmp/upstream/$UP_PATH"/* "$LOCAL_PATH/" 2>/dev/null || true
            else
              cp -r "$SRC_BASE/$UP_PATH"/* "$LOCAL_PATH/" 2>/dev/null || true
            fi
          done

          # Process license
          if yq eval '.import.license' upstream.yaml | grep -q "path"; then
            LIC_COUNT=$(yq eval '.import.license | length' upstream.yaml)
            for ((i=0; i<$LIC_COUNT; i++)); do
              UP_PATH=$(yq eval ".import.license[$i].path" upstream.yaml)
              cp "/tmp/upstream/$UP_PATH" . 2>/dev/null || \
              cp "$SRC_BASE/$UP_PATH" . 2>/dev/null || true
            done
          fi

          # Process readme
          if yq eval '.import.readme' upstream.yaml | grep -q "path"; then
            README_COUNT=$(yq eval '.import.readme | length' upstream.yaml)
            for ((i=0; i<$README_COUNT; i++)); do
              UP_PATH=$(yq eval ".import.readme[$i].path" upstream.yaml)
              cp "/tmp/upstream/$UP_PATH" . 2>/dev/null || \
              cp "$SRC_BASE/$UP_PATH" . 2>/dev/null || true
            done
          fi

          # Process metadata (mirrors upstream's vyges-metadata.json verbatim when
          # declared). Required for Vyges-owned IPs where canonical vyges/<repo>
          # is the source of truth and AI regeneration would strip Vyges-specific
          # fields (protocol_level, interfaces[].signals, etc.). Paired with
          # metadata_locked: true in upstream.yaml to gate the AI step below.
          if yq eval '.import.metadata' upstream.yaml | grep -q "path"; then
            META_COUNT=$(yq eval '.import.metadata | length' upstream.yaml)
            for ((i=0; i<$META_COUNT; i++)); do
              UP_PATH=$(yq eval ".import.metadata[$i].path" upstream.yaml)
              echo "Syncing metadata: $UP_PATH"
              cp "/tmp/upstream/$UP_PATH" . 2>/dev/null || \
              cp "$SRC_BASE/$UP_PATH" . 2>/dev/null || true
            done
          fi

          # Update commit hash for update syncs
          if [[ "${{ steps.check.outputs.sync_type }}" == "update" ]]; then
            yq eval ".upstream.commit = \"${{ steps.check.outputs.latest }}\"" -i upstream.yaml
          fi

          echo "Synced from upstream"

      - name: Check metadata state (informational — no AI fallback)
        id: metadata
        run: |
          # AI metadata generation was removed 2026-04-24. This step now
          # only observes state and logs a summary; missing or skeleton
          # metadata is a hard error that IP authors must resolve by
          # committing a hand-authored vyges-metadata.json to the
          # canonical source.
          if [[ -f vyges-metadata.json ]]; then
            IS_SKELETON=$(jq -r 'if (._note != null) or (.maturity == "draft" and (.interfaces | length) == 0) then "true" else "false" end' vyges-metadata.json)
            if [[ "$IS_SKELETON" == "true" ]]; then
              echo "::warning file=vyges-metadata.json::Metadata is a skeleton (no interfaces, draft maturity, or _note present). Hand-author the full metadata; AI regeneration has been permanently removed from this workflow."
              echo "state=skeleton" >> $GITHUB_OUTPUT
            else
              echo "state=enriched" >> $GITHUB_OUTPUT
            fi
          else
            echo "::warning file=vyges-metadata.json::vyges-metadata.json is missing. Hand-author it — AI regeneration has been permanently removed from this workflow."
            echo "state=missing" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ inputs.force_metadata }}" == "true" ]]; then
            echo "::warning::force_metadata=true was passed but is deprecated and has no effect — the AI regeneration path was removed 2026-04-24."
          fi

      - name: Generate README if missing
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          if [[ ! -f README.md ]] && [[ -f vyges-metadata.json ]]; then
            IP_NAME=$(jq -r '.name' vyges-metadata.json)
            DESCRIPTION=$(jq -r '.description' vyges-metadata.json)
            LICENSE=$(jq -r '.license' vyges-metadata.json)
            UPSTREAM=$(jq -r '.source.url // empty' vyges-metadata.json)

            cat > README.md <<EOF
          # $IP_NAME

          $DESCRIPTION

          ## Upstream

          Imported from [$UPSTREAM]($UPSTREAM). See \`upstream.yaml\` for commit tracking.

          ## Metadata

          See \`vyges-metadata.json\` for complete IP specification including interfaces, parameters, and architecture details.

          ## License

          $LICENSE — see [LICENSE](LICENSE).
          EOF
            echo "Generated README.md"
          fi

      - name: Commit changes
        if: steps.check.outputs.needs_sync == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            BRANCH=$(git branch --show-current || echo "main")
            git add .

            SYNC_TYPE="${{ steps.check.outputs.sync_type }}"
            if [[ "$SYNC_TYPE" == "initial" ]]; then
              MSG="Initial upstream sync

          Synced from ${{ steps.upstream.outputs.repo }}
          Commit: ${{ steps.upstream.outputs.commit }}"
            else
              MSG="Upstream sync: ${{ steps.check.outputs.latest }}

          Updated from ${{ steps.upstream.outputs.commit }}"
            fi

            git commit -m "$MSG"
            git push origin "$BRANCH"
            echo "Changes committed and pushed"
          else
            echo "No changes to commit"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Upstream Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | \`${{ steps.upstream.outputs.repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Sync Type | ${{ steps.check.outputs.sync_type || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Metadata | ${{ steps.metadata.outputs.state || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          if [[ -f vyges-metadata.json ]]; then
            echo "| IP Name | $(jq -r '.name' vyges-metadata.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Maturity | $(jq -r '.maturity' vyges-metadata.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Category | $(jq -r '.categories[0].main_category' vyges-metadata.json) |" >> $GITHUB_STEP_SUMMARY
          fi
